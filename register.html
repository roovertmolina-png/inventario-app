<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="auth-card">
  <h2>Crear cuenta</h2>
  <p class="subtitle">Registrate como administrador o servicio para comenzar.</p>

  <div class="form-grid">
    <input id="correo" class="input-field" placeholder="Correo">
    <input id="password" class="input-field" type="password" placeholder="Contrasena">
    <select id="rol" class="select-field form-grid-full">
      <option value="">Selecciona un rol</option>
      <option value="servicio">Servicio</option>
      <option value="administrador">Administrador</option>
    </select>
  </div>

  <div class="action-row">
    <button class="btn btn-primary" onclick="register()">Registrarse</button>
  </div>

  <p id="mensaje" class="message"></p>
  <p class="footer-link"><a href="login.html">Ya tienes cuenta? Inicia sesion</a></p>
</div>

<script>
function register() {
  const correo = document.getElementById("correo").value.trim();
  const password = document.getElementById("password").value.trim();
  const rol = document.getElementById("rol").value;
  const mensaje = document.getElementById("mensaje");

  if (!correo || !password || !rol) {
    mensaje.innerText = "Todos los campos son obligatorios";
    return;
  }

  fetch("/register", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ correo, password, rol })
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        mensaje.innerText = "Usuario registrado correctamente. Ahora puedes iniciar sesion.";
      } else {
        mensaje.innerText = data.message || "No se pudo registrar el usuario";
      }
    })
    .catch(error => {
      console.error("Error:", error);
      mensaje.innerText = "Error de conexion al servidor";
    });
}
</script>

</body>
</html>
