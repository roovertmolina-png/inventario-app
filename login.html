<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="auth-card">
  <h2>Bienvenido de nuevo</h2>
  <p class="subtitle">Inicia sesión para administrar tu inventario tecnológico.</p>

  <div class="form-grid">
    <input id="correo" class="input-field" placeholder="Correo">
    <input id="password" class="input-field" type="password" placeholder="Contraseña">
  </div>

  <div class="action-row">
    <button class="btn btn-primary" onclick="login()">Ingresar</button>
  </div>

  <p id="mensaje" class="message"></p>
  <p class="footer-link"><a href="register.html">¿No tienes cuenta? Regístrate</a></p>
</div>

<script>
function login() {
  const mensaje = document.getElementById("mensaje");
  const correo = document.getElementById("correo").value.trim();
  const password = document.getElementById("password").value.trim();

  mensaje.innerText = "";

  if (!correo || !password) {
    mensaje.innerText = "Ingresa correo y contrasena";
    return;
  }

  fetch("/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ correo, password })
  })
    .then(async res => {
      const text = await res.text();
      let data;

      try {
        data = text ? JSON.parse(text) : {};
      } catch (error) {
        throw new Error(text || "Respuesta invalida del servidor");
      }

      if (!res.ok) {
        throw new Error(data.message || "Error del servidor");
      }

      return data;
    })
    .then(data => {
      if (data.success) {
        localStorage.setItem("usuario", JSON.stringify(data.usuario));
        window.location.href = "index.html";
      } else {
        mensaje.innerText = data.message || "Datos incorrectos";
      }
    })
    .catch(error => {
      console.error("Error:", error);
      mensaje.innerText = error.message || "Error de conexion al servidor";
    });
}
</script>

</body>
</html>
