<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Tecnológico</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="main-shell">
  <div class="page-header">
    <div>
      <h1 class="page-title">Inventario Tecnológico</h1>
      <p class="subtitle">Registra y gestiona los equipos con una experiencia moderna y clara.</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary" onclick="logout()">
        <span class="btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 17l5-5-5-5v3H9v4h7v3zM8 5h2v14H8V5z"/></svg></span>
        Cerrar sesión
      </button>
      <a class="btn btn-ghost" href="usuarios.html">
        <span class="btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3z" fill="currentColor"/></svg></span>
        Administrar usuarios
      </a>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 14.5h-2v-2h2v2zm0-4h-2V7h2v5.5z"/></svg></span>
      <div>
        <p class="stat-label">Total equipos</p>
        <p id="statTotal" class="stat-value">0</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Registrar Equipo</h2>

    <div class="form-grid">
      <input id="nombre" class="input-field" placeholder="Nombre del equipo">
      <input id="serial" class="input-field" placeholder="Serial">
      <input id="placa" class="input-field" placeholder="Placa">
      <input id="modelo" class="input-field" placeholder="Modelo">
      <input id="marca" class="input-field" placeholder="ID Marca (ej: 1)">
      <input id="tipo" class="input-field" placeholder="ID Tipo (ej: 1)">
      <input id="estado" class="input-field" placeholder="ID Estado (ej: 1)">
      <input id="piso" class="input-field" placeholder="ID Piso (ej: 1)">
      <input id="ciudad" class="input-field" placeholder="Ciudad donde se ubica">
      <input id="edificio" class="input-field" placeholder="Edificio donde se ubica">
      <input id="usuario" class="input-field" placeholder="ID Usuario (ej: 1)">
    </div>

    <div class="action-row">
      <button class="btn btn-primary" onclick="guardarEquipo()">
        <span class="btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3H5c-1.1 0-2 .9-2 2v14a2 2 0 002 2h14a2 2 0 002-2V7l-4-4zm-6 16.5L6.5 15H9v-4h6v4h2.5L11 19.5zM13 9H7V5h6v4z"/></svg></span>
        Guardar Equipo
      </button>
      <button id="cancelEditBtn" class="btn btn-secondary" onclick="cancelarEdicion()" style="display:none;">
        <span class="btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.71L12 12l6.3 6.29-1.42 1.42L12 13.41l-6.29 6.3-1.42-1.42L10.59 12 4.29 5.71 5.71 4.29 12 10.59l6.29-6.3z"/></svg></span>
        Cancelar edición
      </button>
    </div>

    <p id="modoEdicionTexto" class="status-text" style="display:none;"></p>
  </div>

  <div class="card">
    <h2>Lista de equipos</h2>
    <div class="table-wrap">
      <table class="table-modern" id="equiposTabla">
        <thead>
          <tr>
            <th>ID</th>
            <th>Equipo</th>
            <th>Serial</th>
            <th>Placa</th>
            <th>Modelo</th>
            <th>Marca</th>
            <th>Tipo</th>
            <th>Estado</th>
            <th>Piso</th>
            <th>Ciudad</th>
            <th>Edificio</th>
            <th>Usuario</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="equiposBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const usuario = JSON.parse(localStorage.getItem("usuario") || "null");
const esServicio = usuario && usuario.rol === "servicio";

let equipoEditandoId = null;

if (!usuario) {
  window.location.href = "login.html";
}

function logout() {
  localStorage.removeItem("usuario");
  window.location.href = "login.html";
}

function guardarEquipo() {
  const nombre = document.getElementById("nombre").value.trim();
  const serial = document.getElementById("serial").value.trim();
  
  if (!nombre || !serial) {
    alert("Por favor completa los campos obligatorios (nombre y serial)");
    return;
  }

  const url = equipoEditandoId ? `/equipos/${equipoEditandoId}` : "/equipos";
  const method = equipoEditandoId ? "PUT" : "POST";
  
  fetch(url, {
    method: method,
    headers: {
      "Content-Type": "application/json",
      "x-user-role": usuario.rol,
      "x-admin-password": "123"
    },
    body: JSON.stringify({
      nombre_equipo: nombre,
      serial: serial,
      placa: document.getElementById("placa").value.trim(),
      modelo: document.getElementById("modelo").value.trim(),
      marca_id: parseInt(document.getElementById("marca").value) || 0,
      tipo_equipo_id: parseInt(document.getElementById("tipo").value) || 0,
      estado_id: parseInt(document.getElementById("estado").value) || 0,
      piso_id: parseInt(document.getElementById("piso").value) || 0,
      ciudad: document.getElementById("ciudad").value.trim(),
      edificio: document.getElementById("edificio").value.trim(),
      usuario_modifica: parseInt(document.getElementById("usuario").value) || 0
    })
  })
  .then(res => {
    if (!res.ok) {
      throw new Error(`Error HTTP: ${res.status}`);
    }
    return res.json();
  })
  .then(data => {
    if (data.success) {
      alert(data.message || "Equipo guardado correctamente");
      cancelarEdicion();
      loadEquipos();
    } else {
      alert(data.message || "Error al guardar el equipo");
    }
  })
  .catch(err => {
    console.error("Error al guardar:", err);
    alert("Error al guardar: " + err.message);
  });
}

function cargarEquipoParaEditar(id) {
  fetch(`/equipos`)
    .then(res => {
      if (!res.ok) {
        throw new Error(`Error HTTP: ${res.status}`);
      }
      return res.json();
    })
    .then(data => {
      const equipo = data.find(e => e.id === id);
      if (equipo) {
        document.getElementById("nombre").value = equipo.nombre_equipo || "";
        document.getElementById("serial").value = equipo.serial || "";
        document.getElementById("placa").value = equipo.placa || "";
        document.getElementById("modelo").value = equipo.modelo || "";
        document.getElementById("marca").value = equipo.marca_id || "";
        document.getElementById("tipo").value = equipo.tipo_equipo_id || "";
        document.getElementById("estado").value = equipo.estado_id || "";
        document.getElementById("piso").value = equipo.piso_id || "";
        document.getElementById("ciudad").value = equipo.ciudad || "";
        document.getElementById("edificio").value = equipo.edificio || "";
        document.getElementById("usuario").value = equipo.usuario_modifica || "";
        
        equipoEditandoId = id;
        document.getElementById("modoEdicionTexto").textContent = `Editando equipo ID: ${id}`;
        document.getElementById("modoEdicionTexto").style.display = "block";
        document.getElementById("cancelEditBtn").style.display = "inline-block";
        
        // Scroll hacia el formulario
        document.querySelector(".card").scrollIntoView({ behavior: "smooth", block: "start" });
      } else {
        alert("Equipo no encontrado");
      }
    })
    .catch(err => {
      console.error("Error al cargar equipo:", err);
      alert("Error al cargar equipo: " + err.message);
    });
}

function cancelarEdicion() {
  equipoEditandoId = null;
  document.getElementById("modoEdicionTexto").style.display = "none";
  document.getElementById("cancelEditBtn").style.display = "none";
  ["nombre", "serial", "placa", "modelo", "marca", "tipo", "estado", "piso", "ciudad", "edificio", "usuario"].forEach(id => {
    const input = document.getElementById(id);
    if (input) input.value = "";
  });
}

function eliminarEquipo(id) {
  const mensaje = `¿Estás seguro de que quieres eliminar el equipo ID ${id}? Esta acción no se puede deshacer.`;
  
  if (!confirm(mensaje)) {
    return;
  }
  
  fetch(`/equipos/${id}`, {
    method: "DELETE",
    headers: {
      "Content-Type": "application/json",
      "x-user-role": usuario.rol,
      "x-admin-password": "123"
    }
  })
  .then(res => {
    if (!res.ok) {
      throw new Error(`Error HTTP: ${res.status}`);
    }
    return res.json();
  })
  .then(data => {
    if (data.success) {
      alert(data.message || "Equipo eliminado correctamente");
      loadEquipos();
    } else {
      alert(data.message || "Error al eliminar el equipo");
    }
  })
  .catch(err => {
    console.error("Error al eliminar:", err);
    alert("Error al eliminar: " + err.message);
  });
}

function loadEquipos() {
  fetch(`/equipos`)
    .then(res => {
      if (!res.ok) {
        throw new Error(`Error HTTP: ${res.status}`);
      }
      return res.json();
    })
    .then(data => {
      const body = document.getElementById("equiposBody");
      body.innerHTML = "";
      document.getElementById("statTotal").textContent = data.length;

      if (data.length === 0) {
        const row = document.createElement("tr");
        row.innerHTML = '<td colspan="13" style="text-align: center;">No hay equipos registrados</td>';
        body.appendChild(row);
        return;
      }

      data.forEach(e => {
        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${e.id}</td>
          <td>${e.nombre_equipo || "-"}</td>
          <td>${e.serial || "-"}</td>
          <td>${e.placa || "-"}</td>
          <td>${e.modelo || "-"}</td>
          <td>${e.marca_id || "-"}</td>
          <td>${e.tipo_equipo_id || "-"}</td>
          <td>${e.estado_id || "-"}</td>
          <td>${e.piso_id || "-"}</td>
          <td>${e.ciudad || "-"}</td>
          <td>${e.edificio || "-"}</td>
          <td>${e.usuario_modifica || "-"}</td>
          <td>
            <button class="btn btn-small btn-primary" onclick="cargarEquipoParaEditar(${e.id})">
              Editar
            </button>
            <button class="btn btn-small btn-danger" onclick="eliminarEquipo(${e.id})">
              Eliminar
            </button>
          </td>
        `;

        body.appendChild(row);
      });
    })
    .catch(err => {
      console.error("Error al cargar equipos:", err);
      const body = document.getElementById("equiposBody");
      body.innerHTML = '<tr><td colspan="13" style="text-align: center; color: red;">Error al cargar equipos: ' + err.message + '</td></tr>';
    });
}

window.onload = loadEquipos;
</script>

</body>
</html>
