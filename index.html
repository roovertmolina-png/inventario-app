<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory App</title>
</head>
<body>
    <h1>Inventory</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="inventoryTable">
            <!-- Dynamic rows will be added here -->
        </tbody>
    </table>

    <script>
        loadEquipos();

        function loadEquipos() {
            // Example AJAX call to load equipment data
            // This function should fetch and populate the inventory table
            fetch('/api/equipos')
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('inventoryTable');
                    tableBody.innerHTML = '';
                    data.forEach(equipo => {
                        const row = document.createElement('tr');
                        row.innerHTML = `<td>${equipo.id}</td><td>${equipo.name}</td><td><button onclick="editEquipo(${equipo.id})">Edit</button><button onclick="deleteEquipo(${equipo.id})">Delete</button></td>`;
                        tableBody.appendChild(row);
                    });
                });
        }

        function editEquipo(id) {
            // Function to edit equipment details
            console.log('Editing equipment with ID:', id);
            // Implement your edit logic here
        }

        function deleteEquipo(id) {
            // Function to delete equipment
            console.log('Deleting equipment with ID:', id);
            // Implement your delete logic here
        }
    </script>
</body>
</html>
